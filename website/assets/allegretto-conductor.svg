    <path d="m432 236 57-40-17 68c-12-11-27-20-40-28Z" fill="#171717"/>
    <path d="M329 215q27-25 56-23 29-2 57 23l-19 65h-75z" fill="#171717" stroke="none"/>
    <path d="M329 245q28 22 56 0 29 22 57 0l-10 70q-23 22-47 0-24 22-47 0z" fill="#fff"/>
    <ellipse cx="361" cy="260" rx="7" ry="10" fill="#171717"/>
    <ellipse cx="410" cy="260" rx="7" ry="10" fill="#171717"/>
    <circle cx="359" cy="257" r="2.5" fill="#fff" stroke="none"/>
    <circle cx="408" cy="257" r="2.5" fill="#fff" stroke="none"/>
    <path d="M382 277q7 7 14 0l-7 9z" fill="#e56fbe"/>
    <path d="M389 286q-2 13-16 14m16-14q2 13 16 14" fill="none"/>
    <path d="M330 320q25 32 55 2 30 30 57-2l17 85q-24 57-74 57t-73-57z" fill="#171717"/>
    <path d="M357 322l28 33 28-33 19 86q-21 23-47 23t-47-23z" fill="#fff" stroke="none"/>
    <path d="m348 360 37 41 37-41" fill="none" stroke="#e56fbe" stroke-width="5"/>
    <path d="M330 347c-38 4-54 22-68 38m68-20c-42 2-60 13-77 28" fill="none"/>
    <path d="M447 348c39 4 55 22 69 38m-69-20c42 2 60 13 77 28" fill="none"/>
    <path d="M347 447v41m84-41v41" fill="none"/>
    <path d="M347 486q-18 15-32 0m116 0q18 15 32 0" fill="none"/>
    <!-- raised conducting arm -->
    <path d="M445 361c21-36 36-68 47-104" fill="none" stroke="#171717" stroke-width="16"/>
    <path d="M477 263q-4-24 14-33 20-10 31 6-14 15-28 29z" fill="#fff"/>
    <path d="M500 240 604 163" fill="none" stroke="#1687ef" stroke-width="6"/>
    <circle cx="608" cy="160" r="6" fill="#e56fbe" stroke="none"/>
    <!-- cueing paw -->
    <path d="M330 373c-22 19-34 41-38 69" fill="none" stroke="#171717" stroke-width="16"/>
    <path d="M293 438q-11 12 1 24 11 8 23-3" fill="#fff"/>
  </g>

  <!-- Podium and score cards. -->
  <g filter="url(#tiny-shadow)" stroke="#171717" stroke-width="7" stroke-linejoin="round">
    <path d="M245 466h291l-23 80H268z" fill="#1687ef"/>
    <path d="M273 486h235l-9 41H286z" fill="#fff"/>
    <path d="M285 527h211" fill="none" stroke="#e56fbe" stroke-width="5"/>
    <path d="M275 546h230v25H275z" fill="#171717"/>
    <path d="M291 571h198l21 25H270z" fill="#fff"/>
  </g>
  <g fill="#171717">
    <circle cx="308" cy="507" r="5"/><circle cx="330" cy="507" r="5"/><circle cx="352" cy="507" r="5"/>
  </g>
  <text x="390" y="516" fill="#171717" font-family="Georgia, serif" font-size="19" font-style="italic">orchestrate</text>
</svg>
