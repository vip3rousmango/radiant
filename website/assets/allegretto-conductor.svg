<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">A tuxedo cat conducts a room of helpful agents</title>
  <desc id="desc">A playful black and white tuxedo cat stands at a podium, baton raised, while small agent characters follow along behind it.</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#171717" flood-opacity=".14"/>
    </filter>
    <filter id="tiny-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="0" flood-color="#171717" flood-opacity=".12"/>
    </filter>
  </defs>

  <g fill="none" stroke="#171717" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 527c101 25 231 20 330 8 115-14 201-18 290 6" stroke="#1687ef" stroke-width="8" opacity=".32"/>
    <path d="M94 139c73-65 165-92 255-76" stroke="#e56fbe" stroke-width="5" opacity=".52"/>
    <path d="M540 103c46 32 84 78 102 129" stroke="#1687ef" stroke-width="5" opacity=".45"/>
    <circle cx="106" cy="153" r="8" fill="#e56fbe" stroke="none"/>
    <circle cx="644" cy="238" r="8" fill="#1687ef" stroke="none"/>
    <path d="M135 93l8 17 18 2-13 12 4 18-17-9-16 9 4-18-13-12 18-2z" fill="#fff" stroke="#e56fbe" stroke-width="4"/>
    <path d="M616 84l6 13 14 2-10 9 3 14-13-7-13 7 3-14-10-9 14-2z" fill="#fff" stroke="#1687ef" stroke-width="4"/>
  </g>

  <!-- The little ensemble: each agent has a different face, but the same beat. -->
  <g filter="url(#tiny-shadow)" stroke="#171717" stroke-width="5" stroke-linejoin="round">
    <g transform="translate(100 260)">
      <path d="M14 39 5 4l31 19" fill="#fff"/>
      <path d="m65 39 10-35-31 19" fill="#fff"/>
      <rect x="12" y="22" width="66" height="62" rx="28" fill="#fff"/>
      <path d="M12 54h66v30H12z" fill="#171717" stroke="none"/>
      <circle cx="35" cy="50" r="4" fill="#171717" stroke="none"/>
      <circle cx="56" cy="50" r="4" fill="#171717" stroke="none"/>
      <path d="M42 62q5 5 10 0" fill="none"/>
      <path d="M26 84v35M65 84v35" fill="none"/>
    </g>
    <g transform="translate(207 204)">
      <path d="M14 41 3 6l33 19" fill="#171717"/>
      <path d="m67 41 11-35-33 19" fill="#171717"/>
      <rect x="11" y="24" width="70" height="70" rx="30" fill="#171717"/>
      <path d="M17 60q29-25 58 0v34H17z" fill="#fff" stroke="none"/>
      <circle cx="35" cy="51" r="4" fill="#fff" stroke="none"/>
      <circle cx="58" cy="51" r="4" fill="#fff" stroke="none"/>
      <path d="M42 66q6 6 12 0" fill="none" stroke="#fff"/>
      <path d="M25 94v35M67 94v35" fill="none"/>
    </g>
    <g transform="translate(514 218)">
      <path d="M13 41 4 5l32 20" fill="#fff"/>
      <path d="m67 41 10-36-32 20" fill="#fff"/>
      <rect x="11" y="23" width="70" height="69" rx="30" fill="#fff"/>
      <path d="M11 58q35 19 70 0v34H11z" fill="#1687ef" stroke="none"/>
      <circle cx="35" cy="51" r="4" fill="#171717" stroke="none"/>
      <circle cx="58" cy="51" r="4" fill="#171717" stroke="none"/>
      <path d="M41 66q6 5 12 0" fill="none"/>
      <path d="M25 92v35M67 92v35" fill="none"/>
    </g>
    <g transform="translate(605 295) scale(.78)">
      <path d="M14 39 4 5l32 19" fill="#171717"/>
      <path d="m66 39 11-34-32 19" fill="#171717"/>
      <rect x="11" y="23" width="70" height="69" rx="30" fill="#171717"/>
      <path d="M13 62q34-20 66 0v30H13z" fill="#e56fbe" stroke="none"/>
      <circle cx="35" cy="51" r="4" fill="#fff" stroke="none"/>
      <circle cx="58" cy="51" r="4" fill="#fff" stroke="none"/>
      <path d="M42 66q6 5 12 0" fill="none" stroke="#fff"/>
      <path d="M25 92v35M67 92v35" fill="none"/>
    </g>
  </g>

  <!-- Baton and motion lines behind the conductor. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M466 248c72 17 132 55 171 111" stroke="#e56fbe" stroke-width="6" opacity=".75"/>
    <path d="M584 340l57 21-42 41" stroke="#e56fbe" stroke-width="6" opacity=".75"/>
    <path d="M488 219c35-32 74-49 117-52" stroke="#1687ef" stroke-width="5" opacity=".6"/>
  </g>

